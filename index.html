<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CSE • Section H</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --cyan:#00f5ff;
    --violet:#7c3aed;
    --pink:#c026d3;
    --white:#f8fbff;
}

body{
    min-height:100vh;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;

    background:#020207;
    color:white;

    font-family:"Courier New",monospace;
}

/* =========================
   BACKGROUND GRID
========================= */

.grid{
    position:fixed;
    inset:-50%;
    pointer-events:none;

    background-image:
        linear-gradient(rgba(0,245,255,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,245,255,.035) 1px,transparent 1px);

    background-size:45px 45px;

    transform:perspective(500px) rotateX(60deg);

    animation:gridMove 10s linear infinite;
}

@keyframes gridMove{
    from{background-position:0 0}
    to{background-position:0 450px}
}

/* =========================
   AMBIENT GLOW
========================= */

.glowOrb{
    position:fixed;

    width:280px;
    height:280px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(0,245,255,.14),
            rgba(124,58,237,.07),
            transparent 70%
        );

    filter:blur(10px);

    animation:orb 5s ease-in-out infinite alternate;
}

@keyframes orb{
    from{
        transform:scale(.8);
        opacity:.5;
    }

    to{
        transform:scale(1.25);
        opacity:1;
    }
}

/* =========================
   PARTICLES
========================= */

.particles{
    position:fixed;
    inset:0;
    pointer-events:none;
}

.particles i{
    position:absolute;

    width:2px;
    height:2px;

    background:var(--cyan);

    border-radius:50%;

    box-shadow:0 0 8px var(--cyan);

    animation:particle 5s linear infinite;
}

.particles i:nth-child(1){left:10%;top:70%}
.particles i:nth-child(2){left:20%;top:30%;animation-delay:1s}
.particles i:nth-child(3){left:35%;top:80%;animation-delay:2s}
.particles i:nth-child(4){left:55%;top:20%;animation-delay:.5s}
.particles i:nth-child(5){left:70%;top:75%;animation-delay:1.5s}
.particles i:nth-child(6){left:82%;top:35%;animation-delay:2.5s}
.particles i:nth-child(7){left:90%;top:65%;animation-delay:3s}
.particles i:nth-child(8){left:45%;top:10%;animation-delay:1.2s}

@keyframes particle{
    0%{
        opacity:0;
        transform:translateY(30px);
    }

    30%{opacity:.8}

    100%{
        opacity:0;
        transform:translateY(-100px);
    }
}

/* =========================
   MAIN CARD
========================= */

.container{
    width:92%;
    max-width:520px;

    position:relative;
    z-index:5;
}

.card{
    position:relative;

    min-height:390px;

    padding:38px 25px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    border-radius:20px;

    border:1px solid rgba(0,245,255,.25);

    background:
        linear-gradient(
            145deg,
            rgba(10,12,25,.93),
            rgba(2,4,12,.96)
        );

    backdrop-filter:blur(18px);

    box-shadow:
        0 0 35px rgba(0,245,255,.08),
        0 0 100px rgba(124,58,237,.06),
        inset 0 0 45px rgba(0,245,255,.025);

    overflow:hidden;

    animation:cardIn 1s ease;
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:scale(.93);
        filter:blur(10px);
    }

    to{
        opacity:1;
        transform:scale(1);
        filter:blur(0);
    }
}

/* =========================
   SCAN LINE
========================= */

.card .scan{
    position:absolute;

    left:0;
    top:-10%;

    width:100%;
    height:2px;

    background:linear-gradient(
        90deg,
        transparent,
        var(--cyan),
        var(--violet),
        transparent
    );

    box-shadow:
        0 0 15px var(--cyan),
        0 0 30px var(--violet);

    opacity:.5;

    animation:scan 4s linear infinite;
}

@keyframes scan{
    from{top:-5%}
    to{top:105%}
}

/* =========================
   CORNERS
========================= */

.card:before,
.card:after{
    content:"";

    position:absolute;

    width:32px;
    height:32px;

    border-color:var(--cyan);

    opacity:.7;
}

.card:before{
    left:12px;
    top:12px;

    border-top:1px solid;
    border-left:1px solid;
}

.card:after{
    right:12px;
    bottom:12px;

    border-right:1px solid;
    border-bottom:1px solid;
}

/* =========================
   LOADING
========================= */

.loading{
    width:100%;
}

.logo{
    font-size:11px;

    letter-spacing:5px;

    color:rgba(255,255,255,.45);

    margin-bottom:28px;
}

#loadingText{
    font-size:27px;

    letter-spacing:3px;

    color:var(--cyan);

    text-shadow:
        0 0 7px var(--cyan),
        0 0 25px rgba(0,245,255,.45);

    margin-bottom:27px;
}

.loader{
    width:100%;
    height:5px;

    border-radius:10px;

    background:rgba(255,255,255,.05);

    overflow:hidden;
}

.progress{
    width:0%;
    height:100%;

    background:linear-gradient(
        90deg,
        var(--violet),
        var(--cyan),
        white
    );

    box-shadow:
        0 0 12px var(--cyan),
        0 0 30px var(--violet);

    animation:progress 3.2s ease-in-out forwards;
}

@keyframes progress{
    to{width:100%}
}

.status{
    margin-top:18px;

    min-height:18px;

    font-size:11px;

    letter-spacing:1.5px;

    color:rgba(255,255,255,.45);
}

/* =========================
   WELCOME
========================= */

.welcome{
    width:100%;

    display:none;

    animation:welcome .9s cubic-bezier(.2,.8,.2,1);
}

@keyframes welcome{
    from{
        opacity:0;
        transform:translateY(25px) scale(.94);
        filter:blur(7px);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
        filter:blur(0);
    }
}

/* =========================
   ACCESS
========================= */

.access{
    display:inline-block;

    padding:7px 15px;

    border-radius:30px;

    border:1px solid rgba(0,245,255,.35);

    background:rgba(0,245,255,.035);

    color:var(--cyan);

    font-size:10px;

    letter-spacing:2px;

    box-shadow:
        0 0 18px rgba(0,245,255,.08);

    animation:pulse 2s infinite;
}

@keyframes pulse{
    50%{
        box-shadow:
            0 0 28px rgba(0,245,255,.2);
    }
}

/* =========================
   PERSONAL MESSAGE
========================= */

.welcomeSmall{
    margin-top:28px;

    font-size:13px;

    letter-spacing:3px;

    color:rgba(255,255,255,.45);
}

.name{
    display:block;

    margin-top:8px;

    font-family:Arial,sans-serif;

    font-size:35px;

    font-weight:700;

    letter-spacing:2px;

    color:white;

    text-shadow:
        0 0 8px rgba(255,255,255,.7),
        0 0 25px rgba(0,245,255,.4);

    animation:nameGlow 2s ease-in-out infinite alternate;
}

@keyframes nameGlow{
    from{
        text-shadow:
            0 0 5px rgba(255,255,255,.4),
            0 0 15px rgba(0,245,255,.2);
    }

    to{
        text-shadow:
            0 0 10px white,
            0 0 30px rgba(0,245,255,.6);
    }
}

.section{
    margin-top:13px;

    font-size:10px;

    letter-spacing:4px;

    color:var(--cyan);

    opacity:.8;
}

/* =========================
   SUBTITLE
========================= */

.subtitle{
    margin-top:27px;

    font-size:11px;

    line-height:1.9;

    letter-spacing:1.5px;

    color:rgba(255,255,255,.4);
}

/* =========================
   BUTTON
========================= */

button{
    position:relative;

    margin-top:30px;

    padding:14px 31px;

    border-radius:8px;

    border:1px solid var(--cyan);

    background:rgba(0,245,255,.035);

    color:var(--cyan);

    font-family:"Courier New",monospace;

    font-size:13px;

    font-weight:bold;

    letter-spacing:2px;

    cursor:pointer;

    overflow:hidden;

    transition:.3s ease;

    box-shadow:
        0 0 15px rgba(0,245,255,.08);
}

button:before{
    content:"";

    position:absolute;

    top:0;
    left:-100%;

    width:100%;
    height:100%;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.2),
        transparent
    );

    animation:buttonScan 2.5s infinite;
}

@keyframes buttonScan{
    0%{left:-100%}
    50%,100%{left:100%}
}

button:hover{
    background:var(--cyan);

    color:#020207;

    transform:translateY(-3px);

    box-shadow:
        0 0 15px var(--cyan),
        0 0 35px rgba(0,245,255,.4);
}

button:active{
    transform:scale(.95);
}

.footer{
    margin-top:26px;

    font-size:9px;

    letter-spacing:2px;

    color:rgba(255,255,255,.18);

/* =========================
   MOBILE
========================= */

@media(max-width:420px){

    }

    }

    }
}
</style>

        0 0 35px
        rgba(40, 190, 255, .10),

        inset 0 0 35px
        rgba(40, 190, 255, .035);

      overflow: hidden;
    }


    /* Moving light scan */

    .faculty-card::before {

      content: "";

      position: absolute;

      left: 0;
      right: 0;

      top: -100%;

      height: 2px;

      background:
        linear-gradient(
          90deg,
          transparent,
          #55dcff,
          white,
          #55dcff,
          transparent
        );

      box-shadow:
        0 0 20px
        #55dcff;

      animation:
        scanDown 2s ease forwards;
    }


    @keyframes scanDown {

      to {
        top: 100%;
      }

    }


    /* ---------- CARD CONTENT ---------- */

    .access-label {

      color: #62ddff;

      font-size: 11px;

      letter-spacing: 4px;

      margin-bottom: 13px;
    }


    .verified {

      display: inline-block;

      font-size: 11px;

      color: #ffd36a;

      letter-spacing: 2px;

      border:
        1px solid
        rgba(255, 211, 106, .35);

      padding:
        6px
        12px;

      border-radius: 20px;

      margin-bottom: 28px;
    }


    .welcome {

      font-size: 13px;

      letter-spacing: 5px;

      color: #8da4b1;

      margin-bottom: 10px;
    }


    .teacher-name {

      font-size:
        clamp(
          25px,
          7vw,
          34px
        );

      font-weight: 600;

      line-height: 1.2;

      margin-bottom: 17px;

      color: white;

      text-shadow:
        0 0 18px
        rgba(100, 215, 255, .25);
    }


    .faculty-meta {

      font-size: 10px;

      letter-spacing: 2px;

      color: #6f8795;

      margin-bottom: 30px;
    }


    /* ---------- JOIN GROUP BUTTON ---------- */

    .faculty-button {

      width: 100%;

      padding: 14px;

      border:
        1px solid
        rgba(84, 217, 255, .5);

      border-radius: 10px;

      background:
        rgba(50, 190, 240, .08);

      color: #7ee4ff;

      font-size: 12px;

      letter-spacing: 3px;

      cursor: pointer;

      transition: .25s;
    }


    .faculty-button:hover {

      background:
        rgba(50, 190, 240, .18);

      box-shadow:
        0 0 25px
        rgba(50, 190, 240, .2);
    }


    /* ---------- ANIMATIONS ---------- */

    @keyframes fadeIn {

      to {

        opacity: 1;

        transform:
          translateY(0);
      }

    }


    .fadeOut {

      animation:
        fadeOut .45s forwards;
    }


    @keyframes fadeOut {

      to {

        opacity: 0;

        transform:
          scale(.92);
      }

    }


    .revealCard {

      display: block !important;

      animation:
        cardReveal
        .8s
        cubic-bezier(.2,.8,.2,1)
        forwards;
    }


    @keyframes cardReveal {

      from {

        opacity: 0;

        transform:
          translateY(25px)
          scale(.94);
      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }

    }

  `;

  document.head.appendChild(style);


  /* ================= BUILD FACULTY SCREEN ================= */

  const screen =
    document.createElement("div");

  screen.id =
    "facultyAccess";


  screen.innerHTML = `

    <div class="faculty-grid"></div>


    <div class="faculty-particle p1"></div>
    <div class="faculty-particle p2"></div>
    <div class="faculty-particle p3"></div>
    <div class="faculty-particle p4"></div>


    <div class="faculty-center">


      <!-- SECTION H ALWAYS VISIBLE -->

      <div class="faculty-top">
        JIT • CSE • SECTION H
      </div>


      <!-- SCANNER -->

      <div id="facultyScanner">

        <div class="scanner">

          <div class="scanner-ring"></div>

          <div class="scanner-ring2"></div>

          <div class="scanner-core">
            ✦
          </div>

        </div>


        <div
          class="faculty-status"
          id="facultyStatus"
        >
          CONNECTING TO FACULTY SYSTEM...
        </div>

      </div>


      <!-- FINAL FACULTY CARD -->

      <div
        class="faculty-card"
        id="facultyCard"
      >

        <div class="access-label">
          FACULTY ACCESS
        </div>


        <div class="verified">
          ● IDENTITY VERIFIED
        </div>


        <div class="welcome">
          WELCOME,
        </div>


        <div class="teacher-name">
          ${teacherName}
        </div>


        <div class="faculty-meta">
          JIT • CSE • SECTION H • FACULTY PORTAL
        </div>


        <button
          class="faculty-button"
          onclick="
            window.location.href=
            'https://chat.whatsapp.com/LBDoLgNWoeh1rKiWKOvebN'
          "
        >
          JOIN GROUP →
        </button>

      </div>

    </div>

  `;


  document.body.appendChild(screen);


  /* ================= ANIMATION CONTROL ================= */

  const status =
    document.getElementById(
      "facultyStatus"
    );

  const scanner =
    document.getElementById(
      "facultyScanner"
    );

  const card =
    document.getElementById(
      "facultyCard"
    );


  const messages = [

    "CONNECTING TO FACULTY SYSTEM...",

    "SCANNING FACULTY ID...",

    "IDENTITY DETECTED...",

    "VERIFYING ACCESS...",

    "ACCESS VERIFIED ✓"

  ];


  let i = 0;


  const interval =
    setInterval(() => {


      if (i < messages.length) {

        status.textContent =
          messages[i];

        i++;

      }


      if (i === messages.length) {

        clearInterval(interval);


        setTimeout(() => {


          scanner.classList.add(
            "fadeOut"
          );


          setTimeout(() => {

            scanner.style.display =
              "none";

            card.classList.add(
              "revealCard"
            );

          }, 450);


        }, 500);

      }


    }, 650);

})();

</script>

<!-- ================= FACULTY ACCESS SYSTEM - END ================= -->
       
</body>
</html>
