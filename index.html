<style>
  #studentScreen {
    position: fixed;
    inset: 0;
    z-index: 99999;
    overflow: hidden;
    background: #02050a;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
  }

  #studentScreen * {
    box-sizing: border-box;
  }

  .s-bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at center, rgba(0,180,255,.10), transparent 35%),
      radial-gradient(circle at 50% 50%, rgba(255,30,60,.08), transparent 55%),
      #02050a;
  }

  .s-grid {
    position: absolute;
    inset: -50%;
    opacity: .18;
    background-image:
      linear-gradient(rgba(0,210,255,.18) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,210,255,.18) 1px, transparent 1px);
    background-size: 55px 55px;
    transform: perspective(500px) rotateX(62deg);
    animation: gridMove 5s linear infinite;
  }

  @keyframes gridMove {
    from { transform: perspective(500px) rotateX(62deg) translateY(0); }
    to   { transform: perspective(500px) rotateX(62deg) translateY(55px); }
  }

  .s-top {
    position: absolute;
    top: 28px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 11px;
    letter-spacing: 4px;
    color: #72e8ff;
    opacity: .85;
  }

  .s-center {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .s-hud {
    position: relative;
    width: 230px;
    height: 230px;
    opacity: 0;
    transform: scale(.5);
  }

  .s-ring {
    position: absolute;
    inset: 0;
    border: 1px solid rgba(0,220,255,.55);
    border-radius: 50%;
    box-shadow: 0 0 25px rgba(0,210,255,.22);
  }

  .s-ring:nth-child(1) {
    animation: rotate1 4s linear infinite;
  }

  .s-ring:nth-child(2) {
    inset: 18px;
    border-style: dashed;
    border-color: rgba(255,45,75,.7);
    animation: rotate2 3s linear infinite;
  }

  .s-ring:nth-child(3) {
    inset: 40px;
    border-color: rgba(0,220,255,.35);
    animation: rotate1 2s linear infinite reverse;
  }

  @keyframes rotate1 {
    to { transform: rotate(360deg); }
  }

  @keyframes rotate2 {
    to { transform: rotate(-360deg); }
  }

  .s-cross {
    position: absolute;
    inset: 50%;
    width: 180px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #54eaff, transparent);
    transform: translate(-50%, -50%);
    box-shadow: 0 0 12px #00d9ff;
  }

  .s-cross.v {
    transform: translate(-50%, -50%) rotate(90deg);
  }

  .s-scanline {
    position: absolute;
    left: 12%;
    width: 76%;
    height: 2px;
    top: 20%;
    background: #63edff;
    box-shadow: 0 0 15px #00d9ff;
    opacity: .8;
    animation: scan 1.4s ease-in-out infinite;
  }

  @keyframes scan {
    0%,100% { top: 18%; }
    50% { top: 82%; }
  }

  .s-web {
    position: absolute;
    width: 170px;
    height: 170px;
    border-radius: 50%;
    background:
      repeating-conic-gradient(
        from 0deg,
        rgba(0,220,255,.32) 0deg 1deg,
        transparent 1deg 20deg
      );
    -webkit-mask: radial-gradient(circle, transparent 28%, #000 29%, #000 31%, transparent 32%, #000 33%, #000 35%, transparent 36%, #000 37%, #000 39%, transparent 40%, #000 41%, #000 43%, transparent 44%);
    mask: radial-gradient(circle, transparent 28%, #000 29%, #000 31%, transparent 32%, #000 33%, #000 35%, transparent 36%, #000 37%, #000 39%, transparent 40%, #000 41%, #000 43%, transparent 44%);
    opacity: .7;
    animation: webSpin 10s linear infinite;
  }

  @keyframes webSpin {
    to { transform: rotate(360deg); }
  }

  .s-status {
    position: absolute;
    bottom: 23%;
    width: 100%;
    text-align: center;
    font-size: 12px;
    letter-spacing: 3px;
    color: #8defff;
    text-shadow: 0 0 10px #00d9ff;
    opacity: 0;
  }

  .s-verified {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    opacity: 0;
    transform: scale(.7);
  }

  .s-check {
    font-size: 32px;
    color: #65f4ff;
    text-shadow: 0 0 20px #00d9ff;
  }

  .s-verified-text {
    margin-top: 12px;
    font-size: 14px;
    letter-spacing: 4px;
    color: white;
  }

  .s-flash {
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
  }

  .s-card {
    position: absolute;
    width: min(88%, 430px);
    padding: 30px 24px 28px;
    text-align: center;
    border: 1px solid rgba(0,220,255,.55);
    border-radius: 20px;
    background: rgba(3,10,18,.82);
    backdrop-filter: blur(12px);
    box-shadow:
      0 0 35px rgba(0,210,255,.18),
      inset 0 0 35px rgba(0,210,255,.05);
    opacity: 0;
    transform: translateY(25px) scale(.94);
  }

  .s-card-title {
    font-size: 11px;
    letter-spacing: 4px;
    color: #65eaff;
    margin-bottom: 15px;
  }

  .s-dot {
    color: #55f3ff;
  }

  .s-welcome {
    font-size: 13px;
    letter-spacing: 4px;
    color: #a9b8c3;
    margin-bottom: 5px;
  }

  .s-name {
    font-size: clamp(30px, 8vw, 48px);
    font-weight: 800;
    letter-spacing: 2px;
    color: white;
    text-shadow:
      0 0 10px rgba(0,220,255,.5),
      0 0 25px rgba(0,220,255,.25);
    margin-bottom: 12px;
  }

  .s-meta {
    font-size: 11px;
    letter-spacing: 2px;
    color: #78d9e8;
    margin-bottom: 25px;
  }

  .s-join {
    display: inline-block;
    padding: 13px 25px;
    border: 1px solid #45eaff;
    border-radius: 9px;
    color: white;
    text-decoration: none;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 2px;
    background: rgba(0,210,255,.08);
    box-shadow: 0 0 18px rgba(0,210,255,.2);
    transition: .25s;
  }

  .s-join:hover {
    background: rgba(0,210,255,.2);
    box-shadow: 0 0 30px rgba(0,210,255,.45);
    transform: translateY(-2px);
  }

  .particle {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #65eaff;
    border-radius: 50%;
    box-shadow: 0 0 8px #00d9ff;
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    from {
      transform: translateY(100vh);
      opacity: 0;
    }
    15% { opacity: 1; }
    85% { opacity: 1; }
    to {
      transform: translateY(-10vh);
      opacity: 0;
    }
  }

  .show-hud {
    animation: hudIn .6s forwards;
  }

  @keyframes hudIn {
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  .show-status {
    animation: statusIn .35s forwards;
  }

  @keyframes statusIn {
    to { opacity: 1; }
  }

  .verified-show {
    animation: verifiedIn .55s forwards;
  }

  @keyframes verifiedIn {
    50% {
      opacity: 1;
      transform: scale(1.08);
    }
    100% {
      opacity: 1;
      transform: scale(1);
    }
  }

  .flash-show {
    animation: flashIn .35s forwards;
  }

  @keyframes flashIn {
    0% { opacity: 0; }
    25% { opacity: .8; }
    100% { opacity: 0; }
  }

  .card-show {
    animation: cardIn .65s cubic-bezier(.2,.8,.2,1) forwards;
  }

  @keyframes cardIn {
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .s-red-line {
    position: absolute;
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,35,70,.8), transparent);
    box-shadow: 0 0 10px rgba(255,35,70,.5);
    opacity: .45;
  }

  .s-red-line.one { top: 18%; }
  .s-red-line.two { bottom: 18%; }

  @media(max-width:500px) {
    .s-card {
      padding: 26px 18px;
    }

    .s-meta {
      font-size: 9px;
    }
  }
</style>

        transform:
          scale(.92);
      }

    }


    .revealCard {

      display: block !important;

      animation:
        cardReveal
        .8s
        cubic-bezier(.2,.8,.2,1)
        forwards;
    }


    @keyframes cardReveal {

      from {

        opacity: 0;

        transform:
          translateY(25px)
          scale(.94);
      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }

    }

  `;

  document.head.appendChild(style);


  /* ================= BUILD FACULTY SCREEN ================= */

  const screen =
    document.createElement("div");

  screen.id =
    "facultyAccess";


  screen.innerHTML = `

    <div class="faculty-grid"></div>


    <div class="faculty-particle p1"></div>
    <div class="faculty-particle p2"></div>
    <div class="faculty-particle p3"></div>
    <div class="faculty-particle p4"></div>


    <div class="faculty-center">


      <!-- SECTION H ALWAYS VISIBLE -->

      <div class="faculty-top">
        JIT • CSE • SECTION H
      </div>


      <!-- SCANNER -->

      <div id="facultyScanner">

        <div class="scanner">

          <div class="scanner-ring"></div>

          <div class="scanner-ring2"></div>

          <div class="scanner-core">
            ✦
          </div>

        </div>


        <div
          class="faculty-status"
          id="facultyStatus"
        >
          CONNECTING TO FACULTY SYSTEM...
        </div>

      </div>


      <!-- FINAL FACULTY CARD -->

      <div
        class="faculty-card"
        id="facultyCard"
      >

        <div class="access-label">
          FACULTY ACCESS
        </div>


        <div class="verified">
          ● IDENTITY VERIFIED
        </div>


        <div class="welcome">
          WELCOME,
        </div>


        <div class="teacher-name">
          ${teacherName}
        </div>


        <div class="faculty-meta">
          JIT • CSE • SECTION H • FACULTY PORTAL
        </div>


        <button
          class="faculty-button"
          onclick="
            window.location.href=
            'https://chat.whatsapp.com/LBDoLgNWoeh1rKiWKOvebN'
          "
        >
          JOIN GROUP →
        </button>

      </div>

    </div>

  `;


  document.body.appendChild(screen);


  /* ================= ANIMATION CONTROL ================= */

  const status =
    document.getElementById(
      "facultyStatus"
    );

  const scanner =
    document.getElementById(
      "facultyScanner"
    );

  const card =
    document.getElementById(
      "facultyCard"
    );


  const messages = [

    "CONNECTING TO FACULTY SYSTEM...",

    "SCANNING FACULTY ID...",

    "IDENTITY DETECTED...",

    "VERIFYING ACCESS...",

    "ACCESS VERIFIED ✓"

  ];


  let i = 0;


  const interval =
    setInterval(() => {


      if (i < messages.length) {

        status.textContent =
          messages[i];

        i++;

      }


      if (i === messages.length) {

        clearInterval(interval);


        setTimeout(() => {


          scanner.classList.add(
            "fadeOut"
          );


          setTimeout(() => {

            scanner.style.display =
              "none";

            card.classList.add(
              "revealCard"
            );

          }, 450);


        }, 500);

      }


    }, 650);

})();

</script>

<!-- ================= FACULTY ACCESS SYSTEM - END ================= -->
