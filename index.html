<style>
#studentEntry{
  position:fixed;
  inset:0;
  z-index:999999;
  overflow:hidden;
  background:#020409;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

#studentEntry *{
  box-sizing:border-box;
}

.se-bg{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 45%,rgba(0,190,255,.13),transparent 32%),
    radial-gradient(circle at 50% 60%,rgba(255,25,60,.09),transparent 48%),
    #020409;
}

/* moving atmosphere */
.se-glow{
  position:absolute;
  width:70vw;
  height:70vw;
  max-width:500px;
  max-height:500px;
  left:50%;
  top:45%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle,rgba(0,210,255,.09),transparent 65%);
  filter:blur(8px);
  animation:breath 2.5s ease-in-out infinite;
}

@keyframes breath{
  0%,100%{transform:translate(-50%,-50%) scale(.85)}
  50%{transform:translate(-50%,-50%) scale(1.15)}
}

/* cinematic grid */
.se-grid{
  position:absolute;
  width:200%;
  height:200%;
  left:-50%;
  top:-15%;
  opacity:.15;
  background-image:
    linear-gradient(rgba(0,210,255,.22) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,210,255,.22) 1px,transparent 1px);
  background-size:42px 42px;
  transform:perspective(500px) rotateX(62deg);
  animation:gridMove 5s linear infinite;
}

@keyframes gridMove{
  from{transform:perspective(500px) rotateX(62deg) translateY(0)}
  to{transform:perspective(500px) rotateX(62deg) translateY(42px)}
}

/* top HUD */
.se-header{
  position:absolute;
  top:25px;
  left:0;
  width:100%;
  text-align:center;
  z-index:10;
  opacity:0;
  transform:translateY(-15px);
  animation:headerIn .7s .15s forwards;
}

.se-header-main{
  font-size:13px;
  font-weight:700;
  letter-spacing:5px;
  color:#8cefff;
  text-shadow:0 0 15px rgba(0,220,255,.7);
}

.se-header-line{
  width:80px;
  height:1px;
  margin:9px auto 0;
  background:#38eaff;
  box-shadow:0 0 12px #00d9ff;
}

@keyframes headerIn{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* particles */
.se-particle{
  position:absolute;
  width:2px;
  height:2px;
  border-radius:50%;
  background:#7eefff;
  box-shadow:0 0 8px #00d9ff;
  animation:particleUp linear infinite;
}

@keyframes particleUp{
  from{
    transform:translateY(110vh) scale(.5);
    opacity:0;
  }
  15%{opacity:1}
  80%{opacity:1}
  to{
    transform:translateY(-15vh) scale(1.5);
    opacity:0;
  }
}

/* center scanner */
.se-scanner{
  position:absolute;
  left:50%;
  top:46%;
  width:min(72vw,300px);
  height:min(72vw,300px);
  transform:translate(-50%,-50%) scale(.55);
  opacity:0;
  animation:scannerIn .8s .6s forwards;
}

@keyframes scannerIn{
  to{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
}

.se-ring{
  position:absolute;
  inset:0;
  border-radius:50%;
  border:1px solid rgba(47,225,255,.6);
  box-shadow:
    0 0 25px rgba(0,210,255,.15),
    inset 0 0 25px rgba(0,210,255,.08);
}

.se-ring.r1{
  animation:rotateClock 7s linear infinite;
}

.se-ring.r2{
  inset:13%;
  border-style:dashed;
  border-color:rgba(255,45,75,.7);
  animation:rotateAnti 4s linear infinite;
}

.se-ring.r3{
  inset:27%;
  border-color:rgba(82,239,255,.45);
  animation:rotateClock 3s linear infinite;
}

.se-ring.r4{
  inset:39%;
  border-color:rgba(255,255,255,.15);
}

@keyframes rotateClock{
  to{transform:rotate(360deg)}
}

@keyframes rotateAnti{
  to{transform:rotate(-360deg)}
}

/* web/network spokes */
.se-web{
  position:absolute;
  inset:7%;
  border-radius:50%;
  background:
    repeating-conic-gradient(
      from 0deg,
      rgba(0,220,255,.32) 0deg 1deg,
      transparent 1deg 18deg
    );
  -webkit-mask:
    radial-gradient(
      circle,
      transparent 0 27%,
      #000 28% 29%,
      transparent 30% 38%,
      #000 39% 40%,
      transparent 41% 49%,
      #000 50% 51%,
      transparent 52% 59%,
      #000 60% 61%,
      transparent 62%
    );
  mask:
    radial-gradient(
      circle,
      transparent 0 27%,
      #000 28% 29%,
      transparent 30% 38%,
      #000 39% 40%,
      transparent 41% 49%,
      #000 50% 51%,
      transparent 52% 59%,
      #000 60% 61%,
      transparent 62%
    );
  opacity:.8;
  animation:webRotate 12s linear infinite;
}

@keyframes webRotate{
  to{transform:rotate(360deg)}
}

/* scanning beam */
.se-beam{
  position:absolute;
  left:8%;
  width:84%;
  height:3px;
  top:10%;
  background:linear-gradient(
    90deg,
    transparent,
    #69efff,
    #fff,
    #69efff,
    transparent
  );
  box-shadow:
    0 0 10px #00d9ff,
    0 0 25px #00d9ff;
  animation:beam 1.7s ease-in-out infinite;
}

@keyframes beam{
  0%,100%{top:10%;opacity:.3}
  50%{top:90%;opacity:1}
}

/* center core */
.se-core{
  position:absolute;
  left:50%;
  top:50%;
  width:65px;
  height:65px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  border:1px solid rgba(255,255,255,.7);
  background:radial-gradient(circle,#fff 0,#48eaff 8%,rgba(0,210,255,.15) 45%,transparent 70%);
  box-shadow:
    0 0 20px #00d9ff,
    0 0 55px rgba(0,210,255,.45);
  animation:corePulse 1.3s ease-in-out infinite;
}

@keyframes corePulse{
  0%,100%{transform:translate(-50%,-50%) scale(.8)}
  50%{transform:translate(-50%,-50%) scale(1.15)}
}

/* scan text */
.se-status{
  position:absolute;
  left:0;
  width:100%;
  top:calc(46% + min(38vw,160px));
  text-align:center;
  opacity:0;
  z-index:20;
  animation:statusIn .5s 1s forwards;
}

.se-status-text{
  font-size:clamp(14px,4vw,18px);
  font-weight:700;
  letter-spacing:3px;
  color:#d9fbff;
  text-shadow:0 0 14px #00d9ff;
}

.se-progress{
  width:min(230px,62vw);
  height:2px;
  margin:12px auto 0;
  background:rgba(255,255,255,.12);
  overflow:hidden;
}

.se-progress-bar{
  width:35%;
  height:100%;
  background:#4cecff;
  box-shadow:0 0 12px #00d9ff;
  animation:progress 1.6s ease-in-out infinite;
}

@keyframes progress{
  0%{transform:translateX(-120%)}
  100%{transform:translateX(400%)}
}

@keyframes statusIn{
  to{opacity:1}
}

/* verification */
.se-verify{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:50;
  opacity:0;
  pointer-events:none;
}

.se-check-circle{
  width:100px;
  height:100px;
  border-radius:50%;
  border:2px solid #5effff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:52px;
  color:#fff;
  text-shadow:0 0 20px #00d9ff;
  box-shadow:
    0 0 25px rgba(0,220,255,.7),
    inset 0 0 25px rgba(0,220,255,.2);
}

.se-verify-text{
  margin-top:22px;
  font-size:clamp(16px,5vw,22px);
  font-weight:800;
  letter-spacing:4px;
  text-shadow:0 0 15px #00d9ff;
}

.se-verify-sub{
  margin-top:8px;
  font-size:11px;
  letter-spacing:3px;
  color:#7fefff;
}

.se-verify.show{
  animation:verifyShow .8s forwards;
}

@keyframes verifyShow{
  0%{
    opacity:0;
    transform:scale(.7);
  }
  45%{
    opacity:1;
    transform:scale(1.08);
  }
  100%{
    opacity:1;
    transform:scale(1);
  }
}

/* cinematic flash */
.se-flash{
  position:absolute;
  inset:0;
  background:#fff;
  opacity:0;
  z-index:40;
  pointer-events:none;
}

.se-flash.fire{
  animation:flashFire .5s forwards;
}

@keyframes flashFire{
  0%{opacity:0}
  15%{opacity:.8}
  35%{opacity:.15}
  100%{opacity:0}
}

/* final hero card */
.se-final{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  opacity:0;
  transform:scale(.92);
  z-index:100;
  pointer-events:none;
}

.se-final.show{
  animation:finalIn .8s cubic-bezier(.16,.85,.25,1) forwards;
  pointer-events:auto;
}

@keyframes finalIn{
  0%{
    opacity:0;
    transform:scale(.88) translateY(25px);
  }
  70%{
    opacity:1;
    transform:scale(1.02) translateY(0);
  }
  100%{

    transform:scale(1) translateY(0);
  }

    @keyframes gridMove {

      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(45px);
      }

    }


    /* ---------- PARTICLES ---------- */

    .faculty-particle {

      position: absolute;

      width: 3px;
      height: 3px;

      background: #54d9ff;

      border-radius: 50%;

      opacity: 0.7;

      animation:
        floatParticle 4s infinite ease-in-out;
    }

    .p1 {
      left: 18%;
      top: 25%;
      animation-delay: .2s;
    }

    .p2 {
      left: 75%;
      top: 20%;
      animation-delay: 1s;
    }

    .p3 {
      left: 82%;
      top: 70%;
      animation-delay: 1.8s;
    }

    .p4 {
      left: 12%;
      top: 72%;
      animation-delay: 2.5s;
    }

    @keyframes floatParticle {

      0%,
      100% {
        transform: translateY(0);
        opacity: .2;
      }

      50% {
        transform: translateY(-18px);
        opacity: 1;
      }

    }


    /* ---------- MAIN AREA ---------- */

    .faculty-center {

      position: relative;

      width: min(90vw, 430px);

      text-align: center;

      z-index: 5;
    }


    /* ---------- TOP TITLE ---------- */

    .faculty-top {

      font-size: 11px;

      letter-spacing: 4px;

      color: #6fdfff;

      margin-bottom: 35px;

      opacity: 0;

      transform: translateY(10px);

      animation:
        fadeIn .6s forwards .2s;
    }


    /* ---------- SCANNER ---------- */

    .scanner {

      width: 145px;
      height: 145px;

      margin: auto;

      position: relative;

      display: flex;

      align-items: center;
      justify-content: center;
    }


    /* Outer rotating ring */

    .scanner-ring {

      position: absolute;

      inset: 0;

      border:
        1px solid
        rgba(80, 215, 255, .35);

      border-radius: 50%;

      animation:
        rotateRing 2s linear infinite;
    }


    .scanner-ring::before,
    .scanner-ring::after {

      content: "";

      position: absolute;

      width: 18px;
      height: 18px;

      border:
        2px solid
        #53d9ff;
    }


    .scanner-ring::before {

      top: -2px;
      left: 50%;

      border-bottom: none;
      border-left: none;
    }


    .scanner-ring::after {

      bottom: -2px;
      right: 50%;

      border-top: none;
      border-right: none;
    }


    /* Inner rotating ring */

    .scanner-ring2 {

      position: absolute;

      width: 105px;
      height: 105px;

      border:
        1px dashed
        rgba(255, 190, 70, .45);

      border-radius: 50%;

      animation:
        rotateRingReverse 3s linear infinite;
    }


    /* Scanner center */

    .scanner-core {

      width: 46px;
      height: 46px;

      border-radius: 12px;

      border:
        1px solid
        rgba(90, 220, 255, .8);

      box-shadow:
        0 0 25px
        rgba(60, 210, 255, .35);

      display: flex;

      align-items: center;
      justify-content: center;

      color: #62ddff;

      font-size: 20px;

      animation:
        corePulse 1.2s infinite;
    }


    @keyframes rotateRing {

      to {
        transform: rotate(360deg);
      }

    }


    @keyframes rotateRingReverse {

      to {
        transform: rotate(-360deg);
      }

    }


    @keyframes corePulse {

      50% {

        transform: scale(1.12);

        box-shadow:
          0 0 38px
          rgba(60, 210, 255, .6);
      }

    }


    /* ---------- STATUS TEXT ---------- */

    .faculty-status {

      margin-top: 30px;

      min-height: 24px;

      font-size: 12px;

      letter-spacing: 2px;

      color: #b9cbd5;
    }


    /* ---------- FINAL CARD ---------- */

    .faculty-card {

      display: none;

      position: relative;

      padding:
        38px
        25px
        30px;

      border:
        1px solid
        rgba(83, 217, 255, .35);

      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          rgba(12, 25, 36, .96),
          rgba(4, 10, 16, .98)
        );

      box-shadow:

        0 0 35px
        rgba(40, 190, 255, .10),

        inset 0 0 35px
        rgba(40, 190, 255, .035);

      overflow: hidden;
    }


    /* Moving light scan */

    .faculty-card::before {

      content: "";

      position: absolute;

      left: 0;
      right: 0;

      top: -100%;

      height: 2px;

      background:
        linear-gradient(
          90deg,
          transparent,
          #55dcff,
          white,
          #55dcff,
          transparent
        );

      box-shadow:
        0 0 20px
        #55dcff;

      animation:
        scanDown 2s ease forwards;
    }


    @keyframes scanDown {

      to {
        top: 100%;
      }

    }


    /* ---------- CARD CONTENT ---------- */

    .access-label {

      color: #62ddff;

      font-size: 11px;

      letter-spacing: 4px;

      margin-bottom: 13px;
    }


    .verified {

      display: inline-block;

      font-size: 11px;

      color: #ffd36a;

      letter-spacing: 2px;

      border:
        1px solid
        rgba(255, 211, 106, .35);

      padding:
        6px
        12px;

      border-radius: 20px;

      margin-bottom: 28px;
    }


    .welcome {

      font-size: 13px;

      letter-spacing: 5px;

      color: #8da4b1;

      margin-bottom: 10px;
    }


    .teacher-name {

      font-size:
        clamp(
          25px,
          7vw,
          34px
        );

      font-weight: 600;

      line-height: 1.2;

      margin-bottom: 17px;

      color: white;

      text-shadow:
        0 0 18px
        rgba(100, 215, 255, .25);
    }


    .faculty-meta {

      font-size: 10px;

      letter-spacing: 2px;

      color: #6f8795;

      margin-bottom: 30px;
    }


    /* ---------- JOIN GROUP BUTTON ---------- */

    .faculty-button {

      width: 100%;

      padding: 14px;

      border:
        1px solid
        rgba(84, 217, 255, .5);

      border-radius: 10px;

      background:
        rgba(50, 190, 240, .08);

      color: #7ee4ff;

      font-size: 12px;

      letter-spacing: 3px;

      cursor: pointer;

      transition: .25s;
    }


    .faculty-button:hover {

      background:
        rgba(50, 190, 240, .18);

      box-shadow:
        0 0 25px
        rgba(50, 190, 240, .2);
    }


    /* ---------- ANIMATIONS ---------- */

    @keyframes fadeIn {

      to {

        opacity: 1;

        transform:
          translateY(0);
      }

    }


    .fadeOut {

      animation:
        fadeOut .45s forwards;
    }


    @keyframes fadeOut {

      to {

        opacity: 0;

        transform:
          scale(.92);
      }

    }


    .revealCard {

      display: block !important;

      animation:
        cardReveal
        .8s
        cubic-bezier(.2,.8,.2,1)
        forwards;
    }


    @keyframes cardReveal {

      from {

        opacity: 0;

        transform:
          translateY(25px)
          scale(.94);
      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }

    }

  `;

  document.head.appendChild(style);


  /* ================= BUILD FACULTY SCREEN ================= */

  const screen =
    document.createElement("div");

  screen.id =
    "facultyAccess";


  screen.innerHTML = `

    <div class="faculty-grid"></div>


    <div class="faculty-particle p1"></div>
    <div class="faculty-particle p2"></div>
    <div class="faculty-particle p3"></div>
    <div class="faculty-particle p4"></div>


    <div class="faculty-center">


      <!-- SECTION H ALWAYS VISIBLE -->

      <div class="faculty-top">
        JIT • CSE • SECTION H
      </div>


      <!-- SCANNER -->

      <div id="facultyScanner">

        <div class="scanner">

          <div class="scanner-ring"></div>

          <div class="scanner-ring2"></div>

          <div class="scanner-core">
            ✦
          </div>

        </div>


        <div
          class="faculty-status"
          id="facultyStatus"
        >
          CONNECTING TO FACULTY SYSTEM...
        </div>

      </div>


      <!-- FINAL FACULTY CARD -->

      <div
        class="faculty-card"
        id="facultyCard"
      >

        <div class="access-label">
          FACULTY ACCESS
        </div>


        <div class="verified">
          ● IDENTITY VERIFIED
        </div>


        <div class="welcome">
          WELCOME,
        </div>


        <div class="teacher-name">
          ${teacherName}
        </div>


        <div class="faculty-meta">
          JIT • CSE • SECTION H • FACULTY PORTAL
        </div>


        <button
          class="faculty-button"
          onclick="
            window.location.href=
            'https://chat.whatsapp.com/LBDoLgNWoeh1rKiWKOvebN'
          "
        >
          JOIN GROUP →
        </button>

      </div>

    </div>

  `;


  document.body.appendChild(screen);


  /* ================= ANIMATION CONTROL ================= */

  const status =
    document.getElementById(
      "facultyStatus"
    );

  const scanner =
    document.getElementById(
      "facultyScanner"
    );

  const card =
    document.getElementById(
      "facultyCard"
    );


  const messages = [

    "CONNECTING TO FACULTY SYSTEM...",

    "SCANNING FACULTY ID...",

    "IDENTITY DETECTED...",

    "VERIFYING ACCESS...",

    "ACCESS VERIFIED ✓"

  ];


  let i = 0;


  const interval =
    setInterval(() => {


      if (i < messages.length) {

        status.textContent =
          messages[i];

        i++;

      }


      if (i === messages.length) {

        clearInterval(interval);


        setTimeout(() => {


          scanner.classList.add(
            "fadeOut"
          );


          setTimeout(() => {

            scanner.style.display =
              "none";

            card.classList.add(
              "revealCard"
            );

          }, 450);


        }, 500);

      }


    }, 650);

})();

</script>

<!-- ================= FACULTY ACCESS SYSTEM - END ================= -->
       
</body>
</html>
