<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSE • Section H</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at center, #062018 0%, #020807 45%, #000 100%);
    color: #00ff9d;
    font-family: "Courier New", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

/* Moving scan lines */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
        0deg,
        rgba(0,255,157,0.025) 0px,
        rgba(0,255,157,0.025) 1px,
        transparent 1px,
        transparent 4px
    );
    animation: scan 8s linear infinite;
}

@keyframes scan {
    from { transform: translateY(0); }
    to { transform: translateY(20px); }
}

.container {
    width: 90%;
    max-width: 520px;
    text-align: center;
    position: relative;
    z-index: 2;
}

.card {
    padding: 35px 25px;
    border: 1px solid rgba(0,255,157,0.35);
    background: rgba(0,20,14,0.45);
    box-shadow:
        0 0 20px rgba(0,255,157,0.08),
        inset 0 0 30px rgba(0,255,157,0.03);
    backdrop-filter: blur(5px);
}

.small {
    font-size: 13px;
    letter-spacing: 4px;
    opacity: 0.7;
    margin-bottom: 22px;
}

h1 {
    font-size: 31px;
    line-height: 1.3;
    letter-spacing: 3px;
    margin: 18px 0;
}

.glow {
    text-shadow:
        0 0 5px #00ff9d,
        0 0 15px rgba(0,255,157,0.7);
}

.status {
    font-size: 14px;
    margin-top: 20px;
    min-height: 20px;
    opacity: 0.8;
}

.loader {
    width: 100%;
    height: 7px;
    border: 1px solid #00ff9d;
    margin: 28px 0 18px;
    padding: 1px;
}

.progress {
    height: 100%;
    width: 0%;
    background: #00ff9d;
    box-shadow: 0 0 12px #00ff9d;
    animation: loading 3s ease-in-out forwards;
}

@keyframes loading {
    from { width: 0%; }
    to { width: 100%; }
}

.welcome {
    display: none;
    animation: appear 1s ease forwards;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px) scale(0.97);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.access {
    font-size: 13px;
    letter-spacing: 3px;
    margin-bottom: 25px;
    animation: blink 1.5s infinite;
}

@keyframes blink {
    50% { opacity: 0.45; }
}

.name {
    color: #ffffff;
    text-shadow:
        0 0 5px #ffffff,
        0 0 15px rgba(0,255,157,0.7);
}

.subtitle {
    margin-top: 20px;
    font-size: 13px;
    letter-spacing: 2px;
    opacity: 0.65;
    line-height: 1.7;
}

button {
    margin-top: 30px;
    padding: 15px 28px;
    background: transparent;
    color: #00ff9d;
    border: 1px solid #00ff9d;
    font-family: "Courier New", monospace;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    transition: 0.25s ease;
    box-shadow: 0 0 0 rgba(0,255,157,0);
}

button:hover {
    background: #00ff9d;
    color: #000;
    box-shadow:
        0 0 10px #00ff9d,
        0 0 25px rgba(0,255,157,0.5);
    transform: translateY(-2px);
}

button:active {
    transform: scale(0.96);
}

.footer {
    margin-top: 25px;
    font-size: 10px;
    letter-spacing: 2px;
    opacity: 0.3;
}

.error {
    color: #ff5c5c;
    text-shadow: 0 0 10px rgba(255,92,92,0.5);
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <!-- LOADING SCREEN -->

            <h1 class="glow" id="loadingText">
                INITIALIZING...

            <div class="loader">

            <div class="footer">

</div>

<style>
  #teacherAccess {
    position: fixed;
    inset: 0;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at center, rgba(255, 193, 7, 0.08), transparent 45%),
      #050505;
    color: #f5f5f5;
    font-family: "Courier New", monospace;
    overflow: hidden;
  }

  #teacherAccess::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.025) 0px,
      rgba(255,255,255,0.025) 1px,
      transparent 1px,
      transparent 4px
    );
    pointer-events: none;
  }

  .faculty-processing {
    width: min(88%, 520px);
    text-align: center;
    position: relative;
    animation: processingIn 0.5s ease;
  }

  .processing-title {
    color: #ffc107;
    font-size: 13px;
    letter-spacing: 3px;
    margin-bottom: 30px;
    text-shadow: 0 0 12px rgba(255,193,7,0.4);
  }

  .processing-status {
    color: #aaa;
    font-size: 12px;
    letter-spacing: 1.5px;
    min-height: 18px;
    margin-bottom: 18px;
  }

  .processing-bar {
    width: 100%;
    height: 2px;
    background: rgba(255,193,7,0.12);
    overflow: hidden;
    border-radius: 5px;
  }

  .processing-fill {
    width: 0%;
    height: 100%;
    background: #ffc107;
    box-shadow: 0 0 12px rgba(255,193,7,0.8);
    transition: width 0.7s ease;
  }

  .processing-code {
    margin-top: 18px;
    color: #555;
    font-size: 10px;
    letter-spacing: 2px;
  }

  /* FINAL FACULTY CARD */

  .teacher-card {
    width: min(88%, 520px);
    padding: 34px 26px;
    border: 1px solid rgba(255, 193, 7, 0.45);
    border-radius: 18px;
    background: rgba(10, 10, 10, 0.94);
    box-shadow:
      0 0 35px rgba(255, 193, 7, 0.12),
      inset 0 0 25px rgba(255, 193, 7, 0.025);
    text-align: center;
    position: relative;
    animation: finalReveal 0.7s ease forwards;

<script>
(function () {

  const teacherParams =
    new URLSearchParams(window.location.search);

  const teacherCode =
    teacherParams.get("t");

  const teachers = {
    "F01G": "Dr. Gulshan Makkad",
    "F02S": "Shraddha Joshi",
    "F03S": "Suyesha Chavhan",
    "F04T": "Tejaswini Hirudkar",
    "F05B": "Biswajit Saha"
  };

  /*
    If there is no valid teacher code,
    do nothing.
    Student system remains untouched.
  */

  if (!teacherCode || !teachers[teacherCode]) {
    return;
  }

  const teacherName = teachers[teacherCode];

  /* Create teacher overlay */

  const teacherScreen =
    document.createElement("div");

  teacherScreen.id = "teacherAccess";

  teacherScreen.innerHTML = `
    <div class="faculty-processing">

      <div class="processing-title">
        JIT • CSE SECTION H
      </div>

      <div class="processing-status" id="processingStatus">
        INITIALIZING FACULTY PORTAL...
      </div>

      <div class="processing-bar">
        <div class="processing-fill" id="processingFill"></div>
      </div>

      <div class="processing-code">
        FACULTY AUTHENTICATION
      </div>

    </div>
  `;

  document.body.appendChild(teacherScreen);

  const status =
    document.getElementById("processingStatus");

  const fill =
    document.getElementById("processingFill");

  /* SHORT PROCESSING — ABOUT 2.5 SECONDS */

  setTimeout(() => {
    status.textContent =
      "SCANNING FACULTY ID...";
    fill.style.width = "38%";
  }, 500);

  setTimeout(() => {
    status.textContent =
      "VERIFYING ACCESS...";
    fill.style.width = "72%";
  }, 1100);

  setTimeout(() => {
    status.textContent =
      "ACCESS GRANTED ✓";
    fill.style.width = "100%";
  }, 1700);

  /* Show final faculty card */

  setTimeout(() => {

    teacherScreen.innerHTML = `
      <div class="teacher-card">

        <div class="faculty-badge">
          FACULTY ACCESS
        </div>

        <div class="teacher-status">
          ACCESS GRANTED ✓
        </div>

        <div class="teacher-line"></div>

        <div class="teacher-welcome">
          WELCOME,
        </div>

        <div class="teacher-name">
          ${teacherName}
        </div>

        <div class="teacher-subtitle">
          CSE • SECTION H • FACULTY PORTAL
        </div>

        <button id="teacherJoinBtn">
          ENTER GROUP →
        </button>

      </div>
    `;

    document
      .getElementById("teacherJoinBtn")
      .addEventListener("click", function () {

        this.textContent = "CONNECTING...";

        setTimeout(() => {

          window.location.href =
            "https://chat.whatsapp.com/LBDoLgNWoeh1rKiWKOvebN";

        }, 700);

      });

  }, 2500);

})();
</script>
