<head>

<title>CSE • Section H</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --cyan:#00f6ff;
    --violet:#8b5cf6;
    --white:#f5f7ff;
}

body{
    min-height:100vh;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(circle at 50% 45%,rgba(139,92,246,.14),transparent 28%),
        radial-gradient(circle at 20% 20%,rgba(0,246,255,.08),transparent 25%),
        #020207;

    color:white;
    font-family:"Courier New",monospace;
}

/* =========================
   DIGITAL GRID
========================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background-image:
        linear-gradient(rgba(0,246,255,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,246,255,.035) 1px,transparent 1px);

    background-size:45px 45px;

    animation:gridMove 12s linear infinite;
}

@keyframes gridMove{
    from{transform:translateY(0)}
    to{transform:translateY(45px)}
}

/* =========================
   FLOATING PARTICLES
========================= */

.particles{
    position:fixed;
    inset:0;
    pointer-events:none;
}

.particles span{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:var(--cyan);
    box-shadow:0 0 10px var(--cyan);
    opacity:.6;

    animation:float 5s linear infinite;
}

.particles span:nth-child(1){left:12%;top:20%;animation-delay:0s}
.particles span:nth-child(2){left:82%;top:15%;animation-delay:1s}
.particles span:nth-child(3){left:25%;top:80%;animation-delay:2s}
.particles span:nth-child(4){left:75%;top:72%;animation-delay:3s}
.particles span:nth-child(5){left:50%;top:10%;animation-delay:1.5s}
.particles span:nth-child(6){left:90%;top:50%;animation-delay:2.5s}

@keyframes float{
    0%{
        transform:translateY(30px);
        opacity:0;
    }
    30%{opacity:.8}
    70%{opacity:.5}
    100%{
        transform:translateY(-80px);
        opacity:0;
    }
}

/* =========================
   MAIN
========================= */

.container{
    width:92%;
    max-width:520px;
    position:relative;
    z-index:5;
}

/* =========================
   CARD
========================= */

.card{
    position:relative;
    padding:40px 27px;

    text-align:center;

    background:
        linear-gradient(
            145deg,
            rgba(12,12,25,.91),
            rgba(3,5,12,.96)
        );

    border:1px solid rgba(0,246,255,.25);
    border-radius:20px;

    backdrop-filter:blur(18px);

    box-shadow:
        0 0 30px rgba(0,246,255,.07),
        0 0 80px rgba(139,92,246,.06),
        inset 0 0 40px rgba(139,92,246,.025);

    animation:cardIn 1s ease;
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:scale(.94) translateY(20px);
        filter:blur(8px);
    }
    to{
        opacity:1;
        transform:scale(1) translateY(0);
        filter:blur(0);
    }
}

/* Tech corners */

.card::before,
.card::after{
    content:"";
    position:absolute;
    width:32px;
    height:32px;
    border-color:var(--cyan);
    opacity:.75;
}

.card::before{
    top:13px;
    left:13px;
    border-top:1px solid;
    border-left:1px solid;
}

.card::after{
    right:13px;
    bottom:13px;
    border-right:1px solid;
    border-bottom:1px solid;
}

/* =========================
   TOP LABEL
========================= */

.small{
    font-size:11px;
    letter-spacing:4px;
    color:rgba(255,255,255,.48);
}

/* =========================
   LOADING
========================= */

#loadingText{
    margin:25px 0 24px;

    font-size:28px;
    letter-spacing:3px;

    color:var(--cyan);

    text-shadow:
        0 0 8px var(--cyan),
        0 0 25px rgba(0,246,255,.5);

    animation:textPulse 1.5s infinite alternate;
}

@keyframes textPulse{
    from{opacity:.7}
    to{opacity:1}
}

.status{
    min-height:20px;

    font-size:11px;
    letter-spacing:1.5px;

    color:rgba(255,255,255,.5);
}

/* =========================
   ENERGY BAR
========================= */

.loader{
    position:relative;
    width:100%;
    height:5px;

    margin:30px 0 18px;

    overflow:hidden;

    border-radius:10px;
    background:rgba(255,255,255,.05);
}

.progress{
    width:0;
    height:100%;

    background:
        linear-gradient(
            90deg,
            var(--violet),
            var(--cyan),
            white
        );

    box-shadow:
        0 0 10px var(--cyan),
        0 0 25px var(--violet);

    animation:loading 3s ease-in-out forwards;
}

@keyframes loading{
    from{width:0}
    to{width:100%}
}

/* =========================
   WELCOME
========================= */

.welcome{
    display:none;

    animation:welcomeIn 1.2s cubic-bezier(.2,.8,.2,1);
}

@keyframes welcomeIn{
    0%{
        opacity:0;
        transform:translateY(25px) scale(.95);
        filter:blur(8px);
    }

    60%{
        opacity:1;
        transform:translateY(-3px) scale(1.01);
        filter:blur(0);
    }

    100%{
        transform:translateY(0) scale(1);
    }
}

/* =========================
   ACCESS BADGE
========================= */

.access{
    display:inline-block;

    padding:7px 15px;

    border:1px solid rgba(0,246,255,.35);
    border-radius:30px;

    color:var(--cyan);

    font-size:10px;
    letter-spacing:2px;

    background:rgba(0,246,255,.035);

    box-shadow:
        0 0 15px rgba(0,246,255,.08);

    animation:badgePulse 2s infinite;
}

@keyframes badgePulse{
    50%{
        box-shadow:
            0 0 25px rgba(0,246,255,.2);
    }
}

/* =========================
   NAME
========================= */

.welcomeText{
    margin-top:28px;

    font-size:13px;
    letter-spacing:3px;

    color:rgba(255,255,255,.45);
}

.name{
    display:block;

    margin-top:9px;

    font-family:Arial,sans-serif;

    font-size:34px;
    font-weight:700;

    letter-spacing:2px;

    color:#fff;

    text-shadow:
        0 0 7px rgba(255,255,255,.7),
        0 0 20px rgba(0,246,255,.35);

    animation:nameGlow 2.5s ease-in-out infinite alternate;
}

@keyframes nameGlow{
    from{
        text-shadow:
            0 0 6px rgba(255,255,255,.5),
            0 0 15px rgba(0,246,255,.25);
    }

    to{
        text-shadow:
            0 0 8px white,
            0 0 28px rgba(0,246,255,.55);
    }
}

/* =========================
   SECTION
========================= */

.section{
    margin-top:13px;

    font-size:10px;
    letter-spacing:4px;

    color:var(--cyan);
    opacity:.8;
}

/* =========================
   SUBTITLE
========================= */

.subtitle{
    margin-top:27px;

    font-size:11px;
    line-height:1.9;
    letter-spacing:1.5px;

    color:rgba(255,255,255,.43);
}

/* =========================
   BUTTON
========================= */

button{
    position:relative;

    margin-top:30px;
    padding:14px 30px;

    border:1px solid var(--cyan);
    border-radius:8px;

    background:rgba(0,246,255,.035);

    color:var(--cyan);

    font-family:"Courier New",monospace;
    font-size:13px;
    font-weight:bold;
    letter-spacing:2px;

    cursor:pointer;

    overflow:hidden;

    transition:.3s ease;

    box-shadow:
        0 0 15px rgba(0,246,255,.08);
}

button::before{
    content:"";

    position:absolute;
    top:0;
    left:-100%;

    width:100%;
    height:100%;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(0,246,255,.2),
        transparent
    );

    animation:buttonScan 2.5s infinite;
}

@keyframes buttonScan{
    0%{left:-100%}
    50%{left:100%}
    100%{left:100%}
}

button:hover{
    color:#020207;

    background:var(--cyan);

    box-shadow:
        0 0 12px var(--cyan),
        0 0 35px rgba(0,246,255,.35);

    transform:translateY(-3px);
}

button:active{
    transform:scale(.96);
}

/* =========================
   FOOTER
========================= */

.footer{
    margin-top:27px;

    font-size:9px;
    letter-spacing:2px;

    color:rgba(255,255,255,.2);
}

/* =========================
   MOBILE
========================= */

@media(max-width:420px){

    .card{
        padding:36px 21px;
    }

    #loadingText{
        font-size:24px;
    }

    .name{
        font-size:31px;
    }

    .subtitle{
        font-size:10px;
    }
}

</style>
</head>

        12px;

      border-radius: 20px;

      margin-bottom: 28px;
    }


    .welcome {

      font-size: 13px;

      letter-spacing: 5px;

      color: #8da4b1;

      margin-bottom: 10px;
    }


    .teacher-name {

      font-size:
        clamp(
          25px,
          7vw,
          34px
        );

      font-weight: 600;

      line-height: 1.2;

      margin-bottom: 17px;

      color: white;

      text-shadow:
        0 0 18px
        rgba(100, 215, 255, .25);
    }


    .faculty-meta {

      font-size: 10px;

      letter-spacing: 2px;

      color: #6f8795;

      margin-bottom: 30px;
    }


    /* ---------- JOIN GROUP BUTTON ---------- */

    .faculty-button {

      width: 100%;

      padding: 14px;

      border:
        1px solid
        rgba(84, 217, 255, .5);

      border-radius: 10px;

      background:
        rgba(50, 190, 240, .08);

      color: #7ee4ff;

      font-size: 12px;

      letter-spacing: 3px;

      cursor: pointer;

      transition: .25s;
    }


    .faculty-button:hover {

      background:
        rgba(50, 190, 240, .18);

      box-shadow:
        0 0 25px
        rgba(50, 190, 240, .2);
    }


    /* ---------- ANIMATIONS ---------- */

    @keyframes fadeIn {

      to {

        opacity: 1;

        transform:
          translateY(0);
      }

    }


    .fadeOut {

      animation:
        fadeOut .45s forwards;
    }


    @keyframes fadeOut {

      to {

        opacity: 0;

        transform:
          scale(.92);
      }

    }


    .revealCard {

      display: block !important;

      animation:
        cardReveal
        .8s
        cubic-bezier(.2,.8,.2,1)
        forwards;
    }


    @keyframes cardReveal {

      from {

        opacity: 0;

        transform:
          translateY(25px)
          scale(.94);
      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }

    }

  `;

  document.head.appendChild(style);


  /* ================= BUILD FACULTY SCREEN ================= */

  const screen =
    document.createElement("div");

  screen.id =
    "facultyAccess";


  screen.innerHTML = `

    <div class="faculty-grid"></div>


    <div class="faculty-particle p1"></div>
    <div class="faculty-particle p2"></div>
    <div class="faculty-particle p3"></div>
    <div class="faculty-particle p4"></div>


    <div class="faculty-center">


      <!-- SECTION H ALWAYS VISIBLE -->

      <div class="faculty-top">
        JIT • CSE • SECTION H
      </div>


      <!-- SCANNER -->

      <div id="facultyScanner">

        <div class="scanner">

          <div class="scanner-ring"></div>

          <div class="scanner-ring2"></div>

          <div class="scanner-core">
            ✦
          </div>

        </div>


        <div
          class="faculty-status"
          id="facultyStatus"
        >
          CONNECTING TO FACULTY SYSTEM...
        </div>

      </div>


      <!-- FINAL FACULTY CARD -->

      <div
        class="faculty-card"
        id="facultyCard"
      >

        <div class="access-label">
          FACULTY ACCESS
        </div>


        <div class="verified">
          ● IDENTITY VERIFIED
        </div>


        <div class="welcome">
          WELCOME,
        </div>


        <div class="teacher-name">
          ${teacherName}
        </div>


        <div class="faculty-meta">
          JIT • CSE • SECTION H • FACULTY PORTAL
        </div>


        <button
          class="faculty-button"
          onclick="
            window.location.href=
            'https://chat.whatsapp.com/LBDoLgNWoeh1rKiWKOvebN'
          "
        >
          JOIN GROUP →
        </button>

      </div>

    </div>

  `;


  document.body.appendChild(screen);


  /* ================= ANIMATION CONTROL ================= */

  const status =
    document.getElementById(
      "facultyStatus"
    );

  const scanner =
    document.getElementById(
      "facultyScanner"
    );

  const card =
    document.getElementById(
      "facultyCard"
    );


  const messages = [

    "CONNECTING TO FACULTY SYSTEM...",

    "SCANNING FACULTY ID...",

    "IDENTITY DETECTED...",

    "VERIFYING ACCESS...",

    "ACCESS VERIFIED ✓"

  ];


  let i = 0;


  const interval =
    setInterval(() => {


      if (i < messages.length) {

        status.textContent =
          messages[i];

        i++;

      }


      if (i === messages.length) {

        clearInterval(interval);


        setTimeout(() => {


          scanner.classList.add(
            "fadeOut"
          );


          setTimeout(() => {

            scanner.style.display =
              "none";

            card.classList.add(
              "revealCard"
            );

          }, 450);


        }, 500);

      }


    }, 650);

})();

</script>

<!-- ================= FACULTY ACCESS SYSTEM - END ================= -->
       
</body>
</html>
