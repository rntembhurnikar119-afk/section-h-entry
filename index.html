<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CSE • Section H</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at center, #062018 0%, #020807 45%, #000 100%);
    color: #00ff9d;
    font-family: "Courier New", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

/* Moving scan lines */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
        0deg,
        rgba(0,255,157,0.025) 0px,
        rgba(0,255,157,0.025) 1px,
        transparent 1px,
        transparent 4px
    );
    animation: scan 8s linear infinite;
}

@keyframes scan {
    from { transform: translateY(0); }
    to { transform: translateY(20px); }
}

.container {
    width: 90%;
    max-width: 520px;
    text-align: center;
    position: relative;
    z-index: 2;
}

.card {
    padding: 35px 25px;
    border: 1px solid rgba(0,255,157,0.35);
    background: rgba(0,20,14,0.45);
    box-shadow:
        0 0 20px rgba(0,255,157,0.08),
        inset 0 0 30px rgba(0,255,157,0.03);
    backdrop-filter: blur(5px);
}

.small {
    font-size: 13px;
    letter-spacing: 4px;
    opacity: 0.7;
    margin-bottom: 22px;
}

h1 {
    font-size: 31px;
    line-height: 1.3;
    letter-spacing: 3px;
    margin: 18px 0;
}

.glow {
    text-shadow:
        0 0 5px #00ff9d,
        0 0 15px rgba(0,255,157,0.7);
}

.status {
    font-size: 14px;
    margin-top: 20px;
    min-height: 20px;
    opacity: 0.8;
}

.loader {
    width: 100%;
    height: 7px;
    border: 1px solid #00ff9d;
    margin: 28px 0 18px;
    padding: 1px;
}

.progress {
    height: 100%;
    width: 0%;
    background: #00ff9d;
    box-shadow: 0 0 12px #00ff9d;
    animation: loading 3s ease-in-out forwards;
}

@keyframes loading {
    from { width: 0%; }
    to { width: 100%; }
}

.welcome {
    display: none;
    animation: appear 1s ease forwards;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px) scale(0.97);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.access {
    font-size: 13px;
    letter-spacing: 3px;
    margin-bottom: 25px;
    animation: blink 1.5s infinite;
}

@keyframes blink {
    50% { opacity: 0.45; }
}

.name {
    color: #ffffff;
    text-shadow:
        0 0 5px #ffffff,
        0 0 15px rgba(0,255,157,0.7);
}

.subtitle {
    margin-top: 20px;
    font-size: 13px;
    letter-spacing: 2px;
    opacity: 0.65;
    line-height: 1.7;
}

button {
    margin-top: 30px;
    padding: 15px 28px;
    background: transparent;
    color: #00ff9d;
    border: 1px solid #00ff9d;
    font-family: "Courier New", monospace;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    transition: 0.25s ease;
    box-shadow: 0 0 0 rgba(0,255,157,0);
}

button:hover {
    background: #00ff9d;
    color: #000;
    box-shadow:
        0 0 10px #00ff9d,
        0 0 25px rgba(0,255,157,0.5);
    transform: translateY(-2px);
}

button:active {
    transform: scale(0.96);
}

.footer {
    margin-top: 25px;
    font-size: 10px;
    letter-spacing: 2px;
    opacity: 0.3;
}

.error {
    color: #ff5c5c;
    text-shadow: 0 0 10px rgba(255,92,92,0.5);
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <!-- LOADING SCREEN -->
        <div id="loadingScreen">

            <div class="small">
                CSE • SECTION H
            </div>

            <h1 class="glow" id="loadingText">
                INITIALIZING...
            </h1>

            <div class="loader">
                <div class="progress"></div>
            </div>

            <div class="status" id="status">
                CONNECTING TO CSE NETWORK...
            </div>

        </div>


        <!-- WELCOME SCREEN -->
        <div class="welcome" id="welcomeScreen">

            <div class="access">
                ACCESS GRANTED ✓
            </div>

            <div class="small">
                INVITATION VERIFIED
            </div>

            <h1 class="glow">
                WELCOME,<br>
                <span class="name" id="studentName">
                    STUDENT
                </span>
            </h1>

            <div class="small">
                CSE — SECTION H
            </div>

            <p class="subtitle">
                YOUR DIGITAL CLASSROOM AWAITS.
                <br>
                YOUR SEAT IS READY.
            </p>

            <button id="joinButton" onclick="joinGroup()">
                ENTER GROUP →
            </button>

            <div class="footer">
                SECTION H • DIGITAL ENTRY PORTAL
            </div>

        </div>

    </div>

</div>

   ?u=C8R4
   ========================================== */

   ========================================== */

    firstName = fullName.split(" ")[0];
}


/* ==========================================

   ========================================== */

const status = document.getElementById("status");
const loadingText = document.getElementById("loadingText");

setTimeout(() => {
    loadingText.textContent = "VERIFYING...";
    status.textContent = "VERIFYING INVITATION...";
}, 1000);

setTimeout(() => {
    loadingText.textContent = "AUTHENTICATING...";
    status.textContent = "AUTHENTICATING USER...";
}, 2000);

    loadingText.textContent = "ACCESS GRANTED";
    status.textContent = "INVITATION VERIFIED ✓";
}, 3000);


/* ==========================================
   SHOW WELCOME SCREEN
   ========================================== */

setTimeout(() => {

    document.getElementById("loadingScreen").style.display = "none";

    const welcomeScreen =
        document.getElementById("welcomeScreen");

    welcomeScreen.style.display = "block";


    if (fullName) {

        document.getElementById("studentName")
            .textContent = firstName.toUpperCase();

    } else {

        document.getElementById("studentName")
            .textContent = "STUDENT";

        document.getElementById("status")
            .textContent = "INVALID INVITATION";

    }

}, 3500);


/* ==========================================
   WHATSAPP GROUP
   ========================================== */

function joinGroup() {

    const button = document.getElementById("joinButton");

    button.textContent = "CONNECTING...";

    setTimeout(() => {

        window.location.href =
        "https://chat.whatsapp.com/LBDoLgNWoeh1rKiWKOvebN";

    }, 500);

}

</script>

</body>
</html>
