<!-- ================= STUDENT PREMIUM ENTRY ================= -->
<style>
#studentEntry{
  position:fixed;
  inset:0;
  z-index:999999;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 45%,rgba(0,180,255,.13),transparent 32%),
    radial-gradient(circle at 20% 80%,rgba(255,40,90,.08),transparent 30%),
    #03060b;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

#studentEntry *{
  box-sizing:border-box;
}

.se-grid{
  position:absolute;
  inset:-50%;
  background-image:
    linear-gradient(rgba(0,200,255,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,200,255,.055) 1px,transparent 1px);
  background-size:42px 42px;
  transform:perspective(500px) rotateX(58deg) scale(1.5);
  animation:seGrid 8s linear infinite;
}

@keyframes seGrid{
  from{transform:perspective(500px) rotateX(58deg) scale(1.5) translateY(0)}
  to{transform:perspective(500px) rotateX(58deg) scale(1.5) translateY(42px)}
}

.se-vignette{
  position:absolute;
  inset:0;
  background:radial-gradient(circle,transparent 35%,rgba(0,0,0,.75) 100%);
}

.se-particles{
  position:absolute;
  inset:0;
}

.se-particle{
  position:absolute;
  width:3px;
  height:3px;
  border-radius:50%;
  background:#69eaff;
  box-shadow:0 0 10px #69eaff;
  animation:seFloat linear infinite;
}

@keyframes seFloat{
  from{transform:translateY(110vh);opacity:0}
  15%{opacity:1}
  85%{opacity:1}
  to{transform:translateY(-10vh);opacity:0}
}

/* TOP HUD */

.se-top{
  position:absolute;
  top:24px;
  left:50%;
  transform:translateX(-50%);
  width:min(90%,520px);
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:10px;
  letter-spacing:3px;
  color:#78eaff;
  opacity:.85;
}

.se-top span:last-child{
  color:#fff;
}

/* CENTER */

.se-center{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

.se-scanner{
  position:relative;
  width:min(72vw,310px);
  height:min(72vw,310px);
  display:flex;
  align-items:center;
  justify-content:center;
}

.se-ring{
  position:absolute;
  border-radius:50%;
  border:1px solid rgba(69,222,255,.5);
}

.se-ring.r1{
  width:100%;
  height:100%;
  border-top-color:#72edff;
  border-bottom-color:transparent;
  animation:spin 3s linear infinite;
}

.se-ring.r2{
  width:82%;
  height:82%;
  border-right:2px solid #ff496e;
  border-left-color:transparent;
  animation:spinReverse 2.3s linear infinite;
}

.se-ring.r3{
  width:63%;
  height:63%;
  border-top:1px solid white;
  border-bottom:1px solid rgba(0,220,255,.8);
  animation:spin 1.7s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

@keyframes spinReverse{
  to{transform:rotate(-360deg)}
}

.se-core{
  width:31%;
  height:31%;
  border-radius:50%;
  background:
    radial-gradient(circle,#fff 0%,#73edff 8%,#008fbd 30%,#03131c 68%);
  box-shadow:
    0 0 25px #00d9ff,
    0 0 70px rgba(0,180,255,.7),
    inset 0 0 25px #fff;
  animation:corePulse 1.4s ease-in-out infinite;
}

@keyframes corePulse{
  50%{
    transform:scale(1.12);
    box-shadow:0 0 40px #00d9ff,0 0 100px rgba(0,180,255,.8);
  }
}

/* scanning line */

.se-scanline{
  position:absolute;
  width:100%;
  height:2px;
  background:linear-gradient(90deg,transparent,#6ff5ff,transparent);
  box-shadow:0 0 18px #00d9ff;
  animation:scan 2s ease-in-out infinite;
}

@keyframes scan{
  0%,100%{transform:translateY(-120px);opacity:0}
  20%{opacity:1}
  50%{transform:translateY(120px);opacity:1}
  80%{opacity:0}
}

/* STATUS */

.se-status{
  margin-top:34px;
  text-align:center;
  width:90%;
}

.se-status-main{
  font-size:12px;
  letter-spacing:3px;
  color:#7deaff;
  min-height:18px;
  text-shadow:0 0 12px rgba(0,210,255,.7);
}

.se-progress{
  width:min(75vw,280px);
  height:3px;
  margin:15px auto 0;
  background:rgba(255,255,255,.1);
  overflow:hidden;
  border-radius:5px;
}

.se-progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#00bfff,#fff);
  box-shadow:0 0 12px #00d9ff;
  transition:width .35s ease;
}

/* FINAL CARD */

.se-final{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:25px;
  opacity:0;
  transform:scale(.82);
  pointer-events:none;
  transition:1s cubic-bezier(.16,1,.3,1);
}

.se-final.show{
  opacity:1;
  transform:scale(1);
}

.se-card{
  width:min(92vw,470px);
  padding:38px 25px 32px;
  text-align:center;
  position:relative;
  overflow:hidden;
  border:1px solid rgba(91,231,255,.45);
  border-radius:24px;
  background:linear-gradient(
    145deg,
    rgba(8,25,37,.94),
    rgba(3,8,15,.96)
  );
  box-shadow:
    0 0 35px rgba(0,190,255,.18),
    inset 0 0 45px rgba(0,150,255,.04);
  backdrop-filter:blur(18px);
}

.se-card:before{
  content:"";
  position:absolute;
  top:0;
  left:-50%;
  width:200%;
  height:1px;
  background:linear-gradient(90deg,transparent,#7ef4ff,transparent);
  box-shadow:0 0 15px #00d9ff;
  animation:cardLine 2.5s linear infinite;
}

@keyframes cardLine{
  from{transform:translateX(-30%)}
  to{transform:translateX(30%)}
}

.se-check{
  width:70px;
  height:70px;
  margin:0 auto 22px;
  border-radius:50%;
  border:1px solid #65eaff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  color:#6feeff;
  box-shadow:0 0 25px rgba(0,210,255,.45);
}

.se-small{
  font-size:10px;
  letter-spacing:4px;
  color:#72eaff;
  margin-bottom:12px;
}

.se-welcome{
  font-size:15px;
  letter-spacing:5px;
  color:#b8cbd3;
  margin-bottom:7px;
}

.se-name{
  font-size:clamp(42px,12vw,72px);
  font-weight:900;
  letter-spacing:2px;
  line-height:1;
  text-transform:uppercase;
  background:linear-gradient(180deg,#fff,#7cecff);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  text-shadow:0 0 30px rgba(0,210,255,.25);
  margin-bottom:18px;
}

.se-course{
  font-size:11px;
  letter-spacing:3px;
  color:#8d9da5;
  margin-bottom:28px;
}

.se-join{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  min-width:190px;
  padding:13px 22px;
  border:1px solid rgba(100,235,255,.55);
  border-radius:50px;
  color:#8beeff;
  font-size:11px;
  letter-spacing:3px;
  background:rgba(0,180,255,.06);
  box-shadow:0 0 20px rgba(0,190,255,.12);
}

/* ACCESS FLASH */

.se-flash{
  position:absolute;
  inset:0;
  background:white;
  opacity:0;
  pointer-events:none;
}

.se-flash.active{
  animation:flash .5s ease-out;
}

@keyframes flash{
  0%{opacity:0}
  15%{opacity:.35}
  100%{opacity:0}
}
</style>

        cardReveal
        .8s
        cubic-bezier(.2,.8,.2,1)
        forwards;
    }


    @keyframes cardReveal {

      from {

        opacity: 0;

        transform:
          translateY(25px)
          scale(.94);
      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }

    }

  `;

  document.head.appendChild(style);


  /* ================= BUILD FACULTY SCREEN ================= */

  const screen =
    document.createElement("div");

  screen.id =
    "facultyAccess";


  screen.innerHTML = `

    <div class="faculty-grid"></div>


    <div class="faculty-particle p1"></div>
    <div class="faculty-particle p2"></div>
    <div class="faculty-particle p3"></div>
    <div class="faculty-particle p4"></div>


    <div class="faculty-center">


      <!-- SECTION H ALWAYS VISIBLE -->

      <div class="faculty-top">
        JIT • CSE • SECTION H
      </div>


      <!-- SCANNER -->

      <div id="facultyScanner">

        <div class="scanner">

          <div class="scanner-ring"></div>

          <div class="scanner-ring2"></div>

          <div class="scanner-core">
            ✦
          </div>

        </div>


        <div
          class="faculty-status"
          id="facultyStatus"
        >
          CONNECTING TO FACULTY SYSTEM...
        </div>

      </div>


      <!-- FINAL FACULTY CARD -->

      <div
        class="faculty-card"
        id="facultyCard"
      >

        <div class="access-label">
          FACULTY ACCESS
        </div>


        <div class="verified">
          ● IDENTITY VERIFIED
        </div>


        <div class="welcome">
          WELCOME,
        </div>


        <div class="teacher-name">
          ${teacherName}
        </div>


        <div class="faculty-meta">
          JIT • CSE • SECTION H • FACULTY PORTAL
        </div>


        <button
          class="faculty-button"
          onclick="
            window.location.href=
            'https://chat.whatsapp.com/LBDoLgNWoeh1rKiWKOvebN'
          "
        >
          JOIN GROUP →
        </button>

      </div>

    </div>

  `;


  document.body.appendChild(screen);


  /* ================= ANIMATION CONTROL ================= */

  const status =
    document.getElementById(
      "facultyStatus"
    );

  const scanner =
    document.getElementById(
      "facultyScanner"
    );

  const card =
    document.getElementById(
      "facultyCard"
    );


  const messages = [

    "CONNECTING TO FACULTY SYSTEM...",

    "SCANNING FACULTY ID...",

    "IDENTITY DETECTED...",

    "VERIFYING ACCESS...",

    "ACCESS VERIFIED ✓"

  ];


  let i = 0;


  const interval =
    setInterval(() => {


      if (i < messages.length) {

        status.textContent =
          messages[i];

        i++;

      }


      if (i === messages.length) {

        clearInterval(interval);


        setTimeout(() => {


          scanner.classList.add(
            "fadeOut"
          );


          setTimeout(() => {

            scanner.style.display =
              "none";

            card.classList.add(
              "revealCard"
            );

          }, 450);


        }, 500);

      }


    }, 650);

})();

</script>

<!-- ================= FACULTY ACCESS SYSTEM - END ================= -->
       
</body>
</html>
